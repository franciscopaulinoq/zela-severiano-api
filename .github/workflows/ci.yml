name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Os testes de integração sobem um PostgreSQL via Testcontainers; o
      # runner ubuntu-latest já tem Docker disponível.
      - name: Testes
        run: ./mvnw -B test
