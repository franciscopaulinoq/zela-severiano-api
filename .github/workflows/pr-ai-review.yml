name: Revisão automática de PR por IA (coleta em lote)

# Disparo manual e em lote: todos os PRs são revisados com a mesma
# configuração, e os resultados ficam só nos artifacts (nada é publicado nos PRs).
on:
  workflow_dispatch:
    inputs:
      prs:
        description: "Números dos PRs, separados por vírgula (ex.: 30,31,32)"
        required: true
      experimento:
        description: "E1 = P1,P2,P3 com issue completa · E2 = P2 com issue I1,I2 · PILOTO = igual ao E1, para validar a configuração"
        required: true
        type: choice
        options: [PILOTO, E1, E2]

permissions:
  contents: read
  pull-requests: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.lista.outputs.prs }}
    steps:
      - id: lista
        env:
          PRS: ${{ inputs.prs }}
        run: |
          json=$(python3 -c 'import json,os; print(json.dumps([int(p) for p in os.environ["PRS"].replace(" ", "").split(",") if p]))')
          echo "prs=$json" >> "$GITHUB_OUTPUT"

  ai-review:
    timeout-minutes: 40
    needs: preparar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2  # alivia limites de requisição das APIs
      matrix:
        pr: ${{ fromJSON(needs.preparar.outputs.prs) }}
    steps:
      # Commit do próprio PR: o contexto do projeto é o do momento do PR.
      - name: Checkout do PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ matrix.pr }}/head

      # Scripts sempre do main, não da branch do PR.
      - name: Checkout do pipeline (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _pipeline
          sparse-checkout: scripts/pr-review

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do pipeline
        working-directory: _pipeline/scripts/pr-review
        run: pip install -r requirements.txt

      - name: Gerar contexto do projeto (a partir do commit do PR)
        run: python _pipeline/scripts/pr-review/build_project_context.py --raiz .

      - name: Executar revisão
        working-directory: _pipeline/scripts/pr-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_REVIEW_PROJECT_CONTEXT: ${{ github.workspace }}/context/project_context.md
          EXPERIMENTO: ${{ inputs.experimento }}
        run: |
          if [ "$EXPERIMENTO" = "E2" ]; then
            niveis="--niveis-prompt P2 --niveis-issue I1,I2"
          else
            niveis="--niveis-prompt P1,P2,P3 --niveis-issue I3"
          fi
          python review_pr.py --pr ${{ matrix.pr }} --experimento "$EXPERIMENTO" $niveis \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Publicar resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ inputs.experimento }}-pr${{ matrix.pr }}-run${{ github.run_id }}
          path: _pipeline/scripts/pr-review/results/
          retention-days: 90
