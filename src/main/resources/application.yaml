spring:
  application:
    name: zela-severiano
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:zela_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    web:
      pageable:
        page-parameter: pagina
        size-parameter: tamanho
        default-page-size: 10
        max-page-size: 50
        serialization-mode: via-dto
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloudflare:
  r2:
    endpoint: ${CLOUDFLARE_R2_ENDPOINT}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL}

api:
  security:
    token:
      secret: ${JWT_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
